<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Clicker</title>

<style>
    body{
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 40px;
        cursor: url("box_glove_1.png"), auto;
    }

    *{
        cursor: url("box_glove_1.png") 16 16, auto !important;
    }

    .header_images {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #flame {
        width: 1000px;
        height: 300px;
        position: absolute;
        top: 30px;
        z-index: 1;
        margin-bottom: 50px;
    }

    #logo {
        position: relative;
        z-index: 2;
    }

    #counter{
        font-size: 40px;
        margin-bottom: 20px;
        margin-top: 100px;
        margin-bottom: -100px;
    }

    #mainBtn{
        border: none;
        background: none;
        cursor: url("box_glove_1.png") 16 16, pointer !important;
    }

    #Mouse{
        width: 50vw;
        max-width: 600px;
        margin-top: 150px;
        object-fit: cover;
        border-radius: 20px;
        transition: 0.1s;
        cursor: url("box_glove_1.png") 16 16, pointer !important;
    }

    #upgradeBtn{
        margin-top: 20px;
        padding: 12px 24px;
        font-size: 20px;
        cursor: url("box_glove_1.png") 16 16, pointer !important;
    }
    
    #clickCounter {
       
        top: 150px;
        align-self: center;
        color: white;
    }
</style>
</head>

<body>
    <div class="header_images">
        <img id="flame" src="flame.gif">
        <img id="logo" src="logo.png">
        <h2 id="clickCounter">0</h2>
    </div>

    <h1 id="counter">0</h1>
    <h2 id="clickCounter">0</h2>

    <button id="mainBtn">
        <img id="Mouse" src="mouse_1.png">
    </button>

    <br>

    <button id="upgradeBtn">
        Upgrade (25)
    </button>

<script>

const mainBtn = document.getElementById("mainBtn");
const upgradeBtn = document.getElementById("upgradeBtn");
const counter = document.getElementById("counter");
const mouseImg = document.getElementById("Mouse");
const clickCounter = document.getElementById("clickCounter");

const images = {
    mouse_1: "mouse_1.png",
    mouse_1_hit: "mouse_1_hit.png",
    mouse_2: "mouse_2.png",
    mouse_2_hit: "mouse_2_hit.png",
    mouse_3: "mouse_3.png",
    mouse_3_hit: "mouse_3_hit.png",
    mouse_4: "mouse_4.png",
    mouse_4_hit: "mouse_4_hit.png"
};

const levels = [
    { normal: images.mouse_1, hit: images.mouse_1_hit },
    { normal: images.mouse_2, hit: images.mouse_2_hit },
    { normal: images.mouse_3, hit: images.mouse_3_hit },
    { normal: images.mouse_4, hit: images.mouse_4_hit }
];

let amount = 0;
let bonus = 1;
let cost = 25;
let level = 0;

mainBtn.addEventListener("click", () => {

    amount += bonus;

    counter.textContent = amount;
    clickCounter.textContent = `Clicks: ${amount}`;

    mouseImg.src = levels[level].hit;

    setTimeout(() => {
        mouseImg.src = levels[level].normal;
    }, 300);

});

function upgrade() {

    if (amount >= cost) {

        amount = 0;
        bonus *= 2;
        cost *= 2;

        counter.textContent = amount;
        clickCounter.textContent = `Clicks: ${amount}`;
        upgradeBtn.textContent = `Upgrade (${cost})`;

        if (level < levels.length - 1) {
            level++;
            mouseImg.src = levels[level].normal;
        }

    } else {
        alert(`Nepietiek līdzekļu! Jums ir ${amount}, nepieciešams ${cost}!`);
    }
}

upgradeBtn.addEventListener("click", upgrade);

</script>

</body>
</html>
