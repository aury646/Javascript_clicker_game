<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Clicker</title>

<style>
    body{
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 40px;
        cursor: url("images/box_glove_1.png"), auto;
    }

    *{
        cursor: url("images/box_glove_1.png") 16 16, auto !important;
    }

    .header_images {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #flame {
        width: 1000px;
        height: 300px;
        position: absolute;
        top: 30px;
        z-index: 1;
        margin-bottom: 50px;
    }

    #logo {
        position: relative;
        z-index: 2;
    }

    #counter{
        font-size: 40px;
        margin-top: 90px;
        margin-bottom: -20px;
    }

    #mainBtn{
        border: none;
        background: none;
        cursor: url("images/box_glove_1.png") 16 16, pointer !important;
    }

    #Mouse{
        width: 50vw;
        max-width: 600px;
        margin-top: 100px;
        object-fit: cover;
        border-radius: 20px;
        transition: 0.1s;
        cursor: url("images/box_glove_1.png") 16 16, pointer !important;
    }

    #upgradeBtn{
        margin-top: 20px;
        padding: 12px 24px;
        font-size: 20px;
        cursor: url("images/box_glove_1.png") 16 16, pointer !important;
    }

    #clickCounter {
        color: white;
    }

    #healthText {
        font-size: 28px;
        margin-top: 40px;
    }
</style>
</head>

<body>

    <div class="header_images">
        <img id="flame" src="images/flame.gif">
        <img id="logo" src="images/logo.png">
        <h2 id="clickCounter">Clicks: 0</h2>
    </div>

    <h1 id="counter">0</h1>
    <h2 id="healthText">Health: 100 / 100</h2>

    <button id="mainBtn">
        <img id="Mouse" src="images/mouse_1.png">
    </button>

    <br>

    <button id="upgradeBtn">
        Upgrade (25)
    </button>

<script src="script.js">


</script>

</body>
</html>
